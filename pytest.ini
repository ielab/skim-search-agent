[pytest]
; BoolAgent's suite lives in tests/ ONLY. Without this, a bare `pytest` on a
; staged machine collects the prefetched SWE-bench repos' own test suites under
; data/repos/ (Django, sympy, seaborn, ...) -> hundreds of collection errors.
testpaths = tests
norecursedirs = data envs env .venv runs indexes node_modules .git
