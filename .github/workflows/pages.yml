# Publish the project page (docs/) to GitHub Pages on every push to main.
#
# ONE-TIME SETUP, required in this org: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". enablement:true below asks the workflow to create the Pages
# site itself, but GITHUB_TOKEN is not permitted to create Pages sites under the ielab org
# ("Create Pages site failed: Resource not accessible by integration"), so the site has to
# exist before the first successful run. Once it does, enablement is a harmless no-op.
# The page is then served at https://<owner>.github.io/<repo>/ — see docs/PUBLISHING.md
# for the vanity skimsearchagent.github.io route.
name: Deploy project page

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Creates the Pages site where the token is allowed to; where it is not (this org),
      # the site must be created once by hand — see the header. Kept because it makes the
      # workflow portable to repos that do permit it.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
