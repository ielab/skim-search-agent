# Publish the project page (docs/) to GitHub Pages on every push to main.
#
# No manual setup needed: configure-pages runs with enablement:true, so the first run
# creates the Pages site itself (the job holds the pages:write permission below).
# The page is then served at https://<owner>.github.io/<repo>/ — see docs/PUBLISHING.md
# for the vanity skimsearchagent.github.io route.
name: Deploy project page

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement: create the Pages site on first run instead of failing when it does not
      # exist yet. Without it the very first run dies at this step with "Get Pages site
      # failed" until someone flips Settings -> Pages -> Source to GitHub Actions by hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
