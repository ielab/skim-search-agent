# Continuous integration on every push and pull request.
#
# `test` installs the dev extra only (no Java, no torch): the code-repository engines, the
# agent loop, the strategies and the harness; document tests skip without a JVM.
# `test-retrieval` installs the retrieval extra with a CPU torch wheel and a JDK 21, so the
# document tests (Lucene BM25, the structured index behind BQL and Indri) run too.
# `package` builds the wheel, installs it into a clean environment, and loads a condition
# from the installed package (the prompt files are package data).
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (dev extra only)
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q -p no:cacheprovider --junitxml=report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.python-version }}
          path: report.xml

  test-retrieval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (dev and retrieval extras, CPU torch)
        run: |
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev,retrieval]"
      - name: Test with Lucene
        env:
          HF_HUB_OFFLINE: "1"
        run: python -m pytest -q -p no:cacheprovider --junitxml=report-retrieval.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-retrieval
          path: report-retrieval.xml

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
      - name: Install the wheel into a clean venv and load a condition
        run: |
          python -m venv /tmp/clean && /tmp/clean/bin/pip install -q dist/*.whl
          cd /tmp && /tmp/clean/bin/python - <<'EOF'
          import agent_search
          from agent_search.strategies import CONDITIONS
          c = CONDITIONS["research_snip"]
          assert c.render()
          from agent_search.retrievers.registry import available
          assert "agent_research_snip" in available()
          print("installed package OK:", agent_search.__version__, len(c.render()), "chars of prompt")
          EOF
      - name: Console scripts
        run: /tmp/clean/bin/skimsearchagent --help | head -5
