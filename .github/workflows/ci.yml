# Continuous integration: the dependency-light test suite on every push and pull request,
# plus a packaging check that builds the wheel, installs it into a clean environment, and
# loads a prompt condition from the installed package (the prompt files are package data).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (dev extra only — no Java, no torch)
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q -p no:cacheprovider --junitxml=report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.python-version }}
          path: report.xml

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
      - name: Install the wheel into a clean venv and load a condition
        run: |
          python -m venv /tmp/clean && /tmp/clean/bin/pip install -q dist/*.whl
          cd /tmp && /tmp/clean/bin/python - <<'EOF'
          import agent_search
          from agent_search.prompts import load_condition
          prof = load_condition("research_snip", "general")
          assert prof.tool_names, prof
          from agent_search.retrievers.registry import available
          assert "agent_research_snip" in available()
          print("installed package OK:", agent_search.__version__, len(prof.system), "chars of prompt")
          EOF
      - name: Console scripts
        run: /tmp/clean/bin/skimsearchagent --help | head -5
