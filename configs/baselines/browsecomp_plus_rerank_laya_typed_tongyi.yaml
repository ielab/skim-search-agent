# SkimSearchAgent experiment file (schema 1). ONE file = ONE complete setting.
# Run:      skimsearchagent run <this file> [section.key=value ...]
# Validate: skimsearchagent validate <this file>
# Every key that changes what runs or how it is measured is listed; unknown keys are errors.
schema: 1
name: rerank_laya_typed_tongyi                  # Qwen3-Embedding-0.6B pool of 100 reordered by Laya (ModernBERT-large, 1,024 tokens)
strategy: agent_research_iter_reranked           # ITER's tools (top-10 search in ITER's format, get_document), Tongyi prompt without the dedup notice; the listing is the reranked pool

# --- dataset: what is searched and asked
dataset:
  name: browsecomp_plus                  # the original 100,195-document BrowseComp-Plus text (front matter and body, no inserted headings), as the paper evaluates (Sec. 5.1)
  limit: null                            # cap the number of questions (null = all)
  corpus_limit: null                     # cap the shared corpus (null = all; queries whose gold docs fall outside are dropped with a warning)
  only_instances: null                   # path to a file of instance ids to run (null = all)

# --- model: the language model driving the agent
model:
  name: Alibaba-NLP/Tongyi-DeepResearch-30B-A3B # model id: gpt-* / gemini-* route to their APIs; anything else is served (backend api) or in-process (backend vllm); null = the scripted stub policy
  policy: null                           # llm | stub; null = llm when a model is named, else stub
  backend: api                           # api (an OpenAI-compatible server at api_base) | vllm (in-process)
  api_base: http://127.0.0.1:8000/v1     # OpenAI-compatible endpoint for backend=api
  tp: 1                                  # tensor parallelism for backend=vllm
  temperature: 0.6                       # sampling temperature
  seed: 42                               # sampling seed (fixed for reproducibility)
  seeds: null                            # variance band: a list such as [0, 1, 2] -> one seed=N run directory per seed (overrides seed)
  driver: null                           # loop | sdk; null = loop, or sdk when openai-agents is installed and the model is API-served
  reasoning_effort: low                  # OpenAI reasoning models only
  tool_call_format: null                 # a backbone's own tool-call text read when the JSON parser finds none: glm | qwen_xml (null = JSON only)
  top_p: 0.95                            # nucleus sampling for a served or in-process model
  top_k: null                            # top-k sampling for a served model (null = the server's default; DIVER's Qwen3.5 runs use 20)
  presence_penalty: 1.1                  # presence penalty (DIVER's Qwen3.5 runs use 1.5)
  max_tokens: 4000                       # the published setting: a flat 4,000-token budget every turn (DIVER's client uses 4096 then a schedule)
  max_tokens_schedule: null             # the published setting: no per-turn schedule (DIVER's client: '4096,2048,1024')
  thinking: null                         # the published setting: the chat template's own default (DIVER's client passes true)
  timeout_s: 600                         # per-request timeout for API clients
  retry_attempts: 5                      # retries on rate limits / transient errors

# --- agent: the episode loop
agent:
  max_steps: 100                          # tool calls before the forced final answer (ITER's MAX_LLM_CALL_PER_RUN = 50)
  forced_answer_tokens: 2000             # the published setting: 2,000 tokens for the forced final answer (DIVER's client: 10000)
  forced_answer_prefill: null            # text the forced final answer continues from (null = an open <answer> tag, or DIVER's sentence for a text-terminal task)
  forced_answer_nudge: null              # the published setting: the library's own final-turn message (DIVER's client: 'Retrieval complete. You are forbidden to call any tools now. ...')
  prompt_profile: null                   # override the condition's prompt (a condition name or a .md path); null = the strategy's own
  ctx_tokens: 125000                      # history kept in the prompt; the cap below fires first
  ctx_window: 131072                     # the model's full window; with ctx_stop_frac 0.9 the answer is forced near 118,000 tokens (DIVER capped Tongyi at 90,000)
  max_history: null                      # optional cap on how many (assistant, observation) pairs the prompt carries; null = no cap, ctx_tokens alone decides
  ctx_stop_frac: 0.9                     # force the answer once the observed prompt exceeds this fraction of ctx_window (>= 1 disables)

# --- budgets: length limits — all in TOKENS (there are no character limits anywhere)
budgets:
  max_visit_tokens: 12000                # whole-document read cap: what every ITER cell ran with (see docs/ITER.md)
  closer_evidence_arg_tokens: 32         # SDK driver: per-call argument excerpt in the forced-answer evidence
  closer_evidence_obs_tokens: 160        # SDK driver: per-observation excerpt in the forced-answer evidence

# --- listing: how many results a search shows
listing:
  dedup_topk: 10                         # results per search, dedup arms (ITER: 10)
  dedup_pool_k: 100                      # over-fetch pool before dropping already-seen docs, dedup arms (ITER: 100)
  dedup_snippet_tokens: 64                # model tokens of passage shown per hit (ITER's runs: 64)

# --- retrieval: engines and ranking
retrieval:
  dense_model: Qwen/Qwen3-Embedding-0.6B              # the base Qwen3 embedding model, not an ITER fine-tune
  dense_query_style: plain                                  # the sub-query as written: the base model was not trained on a history format
  dense_query_instruction: null                                   # null = the Qwen3-Embedding family's own retrieval instruction
  dense_pooling: null                                   # null = the checkpoint's own config (last-token pooling)
  dense_dtype: bfloat16                               # precision the dense encoder runs in
  dense_seq_length: 512                                    # encoder tokens a document is cut to: the ITER cells' length, so the first stage is compared like for like
  dense_query_seq_length: null                                   # null = the document length
  dense_index: null                      # prebuilt vector index to serve (this library's cache dir, or ITER's index.faiss + index.lookup.pkl); null = the per-corpus cache under index_root
  ann_ef_search: 0                       # HNSW efSearch for a prebuilt index (0 = as built); unused here, 100,195 docs search a flat index
  ann: auto                              # vector index backend: auto | flat | hnsw | ivfpq
  ann_min: 1000000                       # corpus size above which an ANN index is used
  ann_pq_min: 8000000                    # corpus size above which IVF-PQ is used
  rerank_base: dense                     # the retriever whose pool the reranker reorders: the Qwen3-Embedding-0.6B dense model above
  rerank_method: laya                                   # a Jev-style decision model; TypeSafe's recipe: {question, search, candidate} in the state, a noul with true/false criteria
  rerank_model: convaiinnovations/laya-typed-decisions # ModernBERT-large, 1,024 tokens
  rerank_pool: 100                       # candidates from the dense model per search; the reranker orders them and the listing shows the top dedup_topk
  rerank_batch_size: 32                                     # pairs per forward pass
  rerank_max_length: null                                   # null = the checkpoint's own trained length
  dense_device: null                     # device for the dense encoder (null = auto)

# --- evaluation: scoring
evaluation:
  level: function                        # function | file (code arm only; documents ignore it)
  k: [1, 3, 5, 10]                       # rank cutoffs for @k metrics
  workers: 2                             # concurrent episodes against the served model; the published cells ran 2
  judge_model: gpt-4o-mini               # LLM judge for document answers (null = off)
  judge_api_base: null                   # endpoint for a served judge
  rejudge: false                         # re-grade rows that already carry a verdict

# --- output: where the run record goes
output:
  runs_dir: runs/reranker/laya_typed_tongyi # root of the run record (runs_dir/<kind>/<dataset>/<model>/<retriever>)
  results_dir: null                      # explicit run directory (overrides runs_dir layout)
  index_root: indexes                    # where persistent indexes and embedding caches live
  rebuild: false                         # rebuild persistent indexes
  allow_config_drift: false              # resume even if the directory holds a different experiment

# --- env: any other environment knob, verbatim (escape hatch; recorded in config.json)
env:
  HF_HUB_OFFLINE: '1'
