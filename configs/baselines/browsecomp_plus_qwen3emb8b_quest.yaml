schema: 1
name: qwen3emb8b_quest
strategy: agent_research_quest_dense             # the model's own interface: search only, long passages, its prompt
dataset:
  name: browsecomp_plus
  limit: null
  corpus_limit: null
  only_instances: null
model:
  name: osunlp/QUEST-35B-RL
  policy: null
  backend: api
  api_base: http://127.0.0.1:8000/v1
  tp: 1
  temperature: 1.0
  seed: 42
  seeds: null
  driver: null
  reasoning_effort: low
  top_p: 0.95
  top_k: null
  presence_penalty: 1.1                  # the official script's sampling
  max_tokens: 16000                      # the official script's budget per turn
  max_tokens_schedule: null
  thinking: null                         # the chat template's default (the official client sends nothing)
  timeout_s: 600
  retry_attempts: 5
  tool_call_format: null                 # the official prompt asks for JSON inside <tool_call> tags
agent:
  max_steps: 400                        # the official script's call limit
  forced_answer_tokens: 2000
  forced_answer_prefill: null
  forced_answer_nudge: "You have now reached the maximum number of reasoning turns you can use. You must stop making tool calls and, based on all the information above, think again and provide what you consider the most likely answer in the following format:<think>your final thinking</think>\n<answer>your answer</answer>"
  prompt_profile: null
  ctx_tokens: 80000                      # the official run condenses the history at 80,000 tokens; here the newest turns that fit are kept
  ctx_window: 131072
  max_history: null
  ctx_stop_frac: 0.9
budgets:
  max_visit_tokens: 12000
  closer_evidence_arg_tokens: 32
  closer_evidence_obs_tokens: 160
listing:
  dedup_topk: 10
  dedup_pool_k: 100
  dedup_snippet_tokens: 64
retrieval:
  dense_model: Qwen/Qwen3-Embedding-8B
  dense_query_style: plain
  dense_query_instruction: null
  dense_pooling: null
  dense_dtype: bfloat16
  dense_seq_length: 512
  dense_query_seq_length: null
  dense_index: null
  ann_ef_search: 0
  ann: auto
  ann_min: 1000000
  ann_pq_min: 8000000
  dense_device: null
evaluation:
  level: function
  k:
  - 1
  - 3
  - 5
  - 10
  workers: 2
  judge_model: gpt-4o-mini
  judge_api_base: null
  rejudge: false
output:
  runs_dir: runs/backbone/quest_native/qwen3emb8b
  results_dir: null
  index_root: indexes
  rebuild: false
  allow_config_drift: false
env:
  HF_HUB_OFFLINE: '1'
  VLLM_ARGS: --language-model-only --gdn-prefill-backend triton --enable-prefix-caching --mamba-cache-mode align
