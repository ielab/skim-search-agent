# Deep-research eval config (the NEW design). The CLI takes flags directly; this records the
# intended runs for reproducibility. Mirrors configs/eval_swebench.yaml for the DOC arm.

datasets:                         # shared-corpus deep-research benchmarks (domain=general)
  - musique                       # classic multi-hop QA (stage: `python scripts/stage_multihop.py`)
  - browsecomp_plus                # BrowseComp-Plus — NOT auto-staged: place its BEIR files
                                    # (corpus.jsonl/queries.jsonl/qrels/test.tsv) under data/browsecomp_plus/
                                    # yourself (see corpus_build/README.md); scripts/download_data.sh only
                                    # prints this reminder, it does not fetch the files.
level: function                   # metrics still computed; grounded EM/F1 + gold_doc_coverage are the headline
k: [1, 5, 10]

# THE doc arm: search -> fetch a named section, then commit an <answer> (scored grounded EM/F1
# + gold-doc coverage + tokens/steps/calls). `agent_research_bql_dense_snip` is the method (Sieve); `agent_research_bm25`
# is the retrieve-then-visit in-loop access baseline; `agent_research_dci` is the brute-force
# baseline (bash + read over the raw corpus filesystem, no retriever at all — chen2026dci / RISE).
agent_conditions:
  - agent_research_bql_dense_snip
  - agent_research_bm25
  - agent_research_dci

# Non-agent retrieval floors (context only; the doc metric is grounded EM/F1 + coverage, not @k):
floors:
  - name: bm25_local
  - name: bm25_pyserini            # lexical floor (Java)
  - name: dense                    # compact dense
    model: BAAI/bge-base-en-v1.5

metrics_reported:
  - grounded_em                    # the headline: EM of the <answer> against the gold answer,
                                    # gated on citing a gold doc_id (grounded, not just lucky text)
  - grounded_f1                    # F1 counterpart of grounded_em
  - gold_doc_coverage               # did the episode surface a gold doc_id at all (recall proxy)
  - llm_calls                      # efficiency axis (calls / steps / tokens to reach the answer)
  - completion_tokens

# Structured <-> flat pairing (BQL's lift should grow as the corpus gains scopeable structure —
# see agent_search/prompts/skills/bql_doc.md / bql_browsecomp.md for the field profiles these select):
#   musique_structured        (wiki profile: title/section/infobox/body) <-> musique_flat (title/body)
#   browsecomp_plus_structured (browsecomp profile: +author/date)        <-> browsecomp_plus_flat
# Build both members of a pair before running (corpus_build/wikipedia, corpus_build/browsecomp_plus);
# the *_fixture variants (musique_fixture / browsecomp_plus_fixture / hotpotqa_fixture) need no
# staging at all — a tiny inline 3-document corpus for POLICY=stub / no-GPU plumbing checks.
paired_datasets:
  - structured: musique_structured
    flat: musique_flat
  - structured: browsecomp_plus_structured
    flat: browsecomp_plus_flat
