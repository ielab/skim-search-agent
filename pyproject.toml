[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skimsearchagent"
version = "0.3.0"
description = "A research framework for deep-search agents: corpora, retrieval, strategies, evaluation and traces behind one stable contract"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Shuai Wang" },
    { name = "Haodong Chen" },
    { name = "Yu Yin" },
    { name = "Shengyao Zhuang" },
    { name = "Bevan Koopman" },
    { name = "Guido Zuccon" },
]
keywords = ["deep-research", "information-retrieval", "llm-agents", "rag", "agent-evaluation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The core (agent loop, BQL reference executor, local BM25, evaluation harness) needs only
# PyYAML for the prompt profiles. Everything heavier is an extra.
dependencies = ["pyyaml==6.0.3"]

[project.urls]
Homepage = "https://github.com/ielab/skim-search-agent"
Repository = "https://github.com/ielab/skim-search-agent"
"Project page" = "https://ielab.github.io/skim-search-agent/"
Paper = "https://arxiv.org/abs/2608.02751"

[project.scripts]
skimsearchagent = "agent_search.cli:main"
skimsearchagent-eval = "agent_search.evaluation.run_eval:main"
skimsearchagent-build-indexes = "agent_search.evaluation.build_indexes:main"
skimsearchagent-judge = "agent_search.evaluation.llm_judge:main"
skimsearchagent-build-triples = "agent_search.training.build_triples:main"
skimsearchagent-train-retriever = "agent_search.training.retriever:main"
skimsearchagent-eval-retriever = "agent_search.training.retriever_eval:main"
skimsearchagent-sample-dataset = "agent_search.evaluation.sample:main"

[project.optional-dependencies]
# Pins match requirements.txt — the exact environment that produced the paper's results.
retrieval = [
    "pyserini==1.2.0",
    "sentence-transformers==5.5.1",
    "faiss-cpu==1.14.3",
    "transformers==5.10.2",
    "torch==2.11.0",
    "tiktoken>=0.9",
]
api = ["openai==2.41.0", "tiktoken>=0.9"]
serve = ["vllm==0.22.1", "openai==2.41.0", "tiktoken>=0.9"]
eval = ["datasets==5.0.0", "numpy==2.2.6", "scipy==1.15.3", "tqdm==4.68.1", "tiktoken>=0.9"]
dev = ["pytest==9.0.3", "numpy==2.2.6", "openai==2.41.0", "tiktoken>=0.9", "build>=1.2"]
demo-live = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "openai==2.41.0"]
# The OpenAI Agents SDK driver. NOTE: openai-agents requires a newer `openai` than the paper
# pin above, so this extra is a separate lane — install it into an environment where moving
# `openai` to 3.x is acceptable. The text-parsed loop driver (the default) needs no extra.
agents = ["openai-agents>=0.22"]
# Retriever training (the ITER recipe). FlagEmbedding 1.3.5 needs an older transformers than the
# retrieval extra pins, so this lane gets its own environment; see docs/TRAINING.md.
train = ["FlagEmbedding==1.3.5", "peft>=0.10", "accelerate>=0.30", "tiktoken>=0.9"]
all = [
    "pyserini==1.2.0",
    "sentence-transformers==5.5.1",
    "faiss-cpu==1.14.3",
    "transformers==5.10.2",
    "torch==2.11.0",
    "openai==2.41.0",
    "vllm==0.22.1",
    "datasets==5.0.0",
    "numpy==2.2.6",
    "scipy==1.15.3",
    "tqdm==4.68.1",
    "tiktoken>=0.9",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["agent_search*"]

# Prompt profiles, tool declarations and skill manuals are DATA the package reads at import
# (agent_search/legacy/prompts/loader.py resolves them next to __file__); they must ship in the wheel.
[tool.setuptools.package-data]
"agent_search.legacy.prompts" = ["*.yaml", "tasks/*.md", "skills/*.md", "vendor/*/*.yaml"]
"agent_search.tasks" = ["*/prompt.md"]
"agent_search.tools" = ["*/*.md"]
"agent_search.training" = ["patches/*.patch"]

# Roadmap note: the import path stays `agent_search` for continuity with the paper's
# artifacts; the distribution name is `skimsearchagent`.
