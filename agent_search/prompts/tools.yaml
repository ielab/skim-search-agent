# Toolsets (condition -> tool list) and tool definitions (description, arguments, and the
# per-domain manual each tool surfaces to the agent). Manuals live in skills/*.md.
toolsets:
  bm25_autoread:
  - bm25_read_search
  bm25_dci:
  - bm25_search
  - bash
  - read
  bm25_fetch_snip:
  - bm25_search_snip
  - fetch
  bql_dense_fetch:
  - search_bqldf
  - fetch_bqldf
  bql_dense_snip:
  - search_bqlds
  - fetch_bqlds
  bql_donly_snip:
  - search_bqldos
  - fetch_bqldos
  dci:
  - bash
  - read
  dense_autoread:
  - dense_read_search
  dense_fetch:
  - dense_search_f
  - fetch
  dense_visit:
  - dense_search
  - visit_d
  hybrid_fetch_snip:
  - hybrid_search_snip
  - fetch
  hybrid_visit:
  - hybrid_search
  - visit_h
  indri_snip:
  - isearch_s
  - fetch
  research_bm25:
  - bm25_search
  - visit
  search_fetch_s:
  - search_s
  - fetch_s
tools:
  bash:
    description: "Run a bash command (grep/rg/ls/find/wc) in the corpus directory to search for candidate\
      \ files. The corpus directory contains only the documents available to you this episode (with bm25_search:\
      \ only its top-ranked hits) \u2014 there is no broader search/retrieval tool. Output is truncated\
      \ to the last ~2000 lines or ~50KB, whichever is hit first."
    parameters:
      type: object
      properties:
        command:
          type: string
          description: A bash command, e.g. rg -l 'term' . or grep -rn 'term' .
        timeout:
          type: number
          description: Timeout in seconds (optional, default 60).
      required:
      - command
  bm25_read_search:
    description: "Keyword search over the document corpus (BM25); returns the FULL TEXT of the top-ranked\
      \ documents directly (not a listing to visit) \u2014 there is no separate visit or fetch tool in\
      \ this condition, so everything you need from a hit is already in this response."
    parameters:
      type: object
      properties:
        query:
          type: string
          description: 'A keyword query, for example: treaty that ended the Mexican-American War.'
      required:
      - query
  bm25_search:
    description: "Keyword search over the document corpus (BM25); returns ranked documents (with `fetch`\
      \ available: each hit's title + section names + infobox keys; otherwise title + a short opening\
      \ snippet). Depending on the toolset: `visit` a ranked doc for its full text, `fetch` a named section\
      \ of a ranked doc, or (bm25_dci) `bash`/`read` the ranked docs directly \u2014 no other documents\
      \ are reachable."
    parameters:
      type: object
      properties:
        query:
          type: string
          description: 'A keyword query, for example: treaty that ended the Mexican-American War.'
      required:
      - query
  bm25_search_snip:
    description: "Keyword search over the document corpus (BM25); returns ranked docs plus their section\
      \ names + infobox keys + a best-matching excerpt for your query \u2014 NOT full text; fetch a named\
      \ section to read. `fetch` a named section (or the infobox) of a ranked doc \u2014 no other documents\
      \ are reachable."
    parameters:
      type: object
      properties:
        query:
          type: string
          description: 'A keyword query, for example: treaty that ended the Mexican-American War.'
        k:
          type: integer
          description: Max ranked candidates to return (default 10).
      required:
      - query
  dense_read_search:
    description: "Semantic/dense retrieval search over the document corpus (dense embeddings, cosine similarity);\
      \ returns the FULL TEXT of the top-ranked documents directly (not a listing to visit) \u2014 there\
      \ is no separate visit or fetch tool in this condition, so everything you need from a hit is already\
      \ in this response."
    parameters:
      type: object
      properties:
        query:
          type: string
          description: 'A natural-language query describing what you are looking for, for example: treaty
            that ended the Mexican-American War.'
      required:
      - query
  dense_search:
    description: "Semantic similarity search over the document corpus (dense embeddings, cosine similarity);\
      \ returns ranked documents (title + a short opening snippet). `visit` a ranked doc for its full\
      \ text \u2014 no other documents are reachable."
    parameters:
      type: object
      properties:
        query:
          type: string
          description: 'A natural-language query describing what you are looking for, for example: treaty
            that ended the Mexican-American War.'
      required:
      - query
  dense_search_f:
    description: "Semantic similarity search over the document corpus (dense embeddings, cosine similarity);\
      \ returns ranked docs plus their section names + infobox keys + a best-matching excerpt for your\
      \ query \u2014 NOT full text; fetch a named section to read. `fetch` a named section (or the infobox)\
      \ of a ranked doc \u2014 no other documents are reachable."
    parameters:
      type: object
      properties:
        query:
          type: string
          description: 'A natural-language query describing what you are looking for, for example: treaty
            that ended the Mexican-American War.'
        k:
          type: integer
          description: Max ranked candidates to return (default 10).
      required:
      - query
  fetch:
    description: "Pull a specific part of a candidate a previous search ranked \u2014 code: a function/method\
      \ name or a line range like L1-40; docs: a named section or the infobox. Never the whole file/document."
    parameters:
      type: object
      properties:
        specs:
          type: array
          description: List of [rank, part] pairs referencing the last search's numbering; part is a name
            from that candidate's structure list (or an L-range for code).
          items:
            type: array
      required:
      - specs
  fetch_bqldf:
    description: "Pull a specific part of a candidate a previous search ranked \u2014 code: a function/method\
      \ name or a line range like L1-40; docs: a named section or the infobox. Never the whole file/document."
    parameters:
      type: object
      properties:
        specs:
          type: array
          description: List of [rank, part] pairs referencing the last search's numbering; part is a name
            from that candidate's structure list (or an L-range for code).
          items:
            type: array
      required:
      - specs
  fetch_bqldos:
    description: "Pull a specific part of a candidate a previous search ranked \u2014 code: a function/method\
      \ name or a line range like L1-40; docs: a named section or the infobox. Never the whole file/document."
    parameters:
      type: object
      properties:
        specs:
          type: array
          description: List of [rank, part] pairs referencing the last search's numbering; part is a name
            from that candidate's structure list (or an L-range for code).
          items:
            type: array
      required:
      - specs
  fetch_bqlds:
    description: "Pull a specific part of a candidate a previous search ranked \u2014 code: a function/method\
      \ name or a line range like L1-40; docs: a named section or the infobox. Never the whole file/document."
    parameters:
      type: object
      properties:
        specs:
          type: array
          description: List of [rank, part] pairs referencing the last search's numbering; part is a name
            from that candidate's structure list (or an L-range for code).
          items:
            type: array
      required:
      - specs
  fetch_s:
    description: "Pull a specific part of a candidate a previous search ranked \u2014 code: a function/method\
      \ name or a line range like L1-40; docs: a named section or the infobox. Never the whole file/document."
    parameters:
      type: object
      properties:
        specs:
          type: array
          description: List of [rank, part] pairs referencing the last search's numbering; part is a name
            from that candidate's structure list (or an L-range for code).
          items:
            type: array
      required:
      - specs
  hybrid_search:
    description: "Hybrid keyword+semantic search over the document corpus: a canonical Lucene BM25 ranking\
      \ and a dense-embedding (cosine similarity) ranking are each computed over a top-100 pool, then\
      \ combined by Reciprocal Rank Fusion (RRF, k=60) into one ranked list. Returns ranked documents\
      \ (title + a short opening snippet). `visit_h` a ranked doc for its full text \u2014 no other documents\
      \ are reachable."
    parameters:
      type: object
      properties:
        query:
          type: string
          description: 'A keyword or natural-language query, for example: treaty that ended the Mexican-American
            War.'
        k:
          type: integer
          description: Max fused candidates to return (default 5).
      required:
      - query
  hybrid_search_snip:
    description: "Hybrid keyword+semantic search over the document corpus (Reciprocal Rank Fusion, RRF\
      \ k=60, over a top-100 canonical BM25 pool and a top-100 dense-embedding pool). Returns ranked docs\
      \ plus their section names + infobox keys + a best-matching excerpt for your query \u2014 NOT full\
      \ text; fetch a named section to read. `fetch` a named section (or the infobox) of a ranked doc\
      \ \u2014 no other documents are reachable."
    parameters:
      type: object
      properties:
        query:
          type: string
          description: 'A keyword or natural-language query, for example: treaty that ended the Mexican-American
            War.'
        k:
          type: integer
          description: Max fused candidates to return (default 10).
      required:
      - query
  isearch_s:
    description: "Indri structured query over the corpus (#combine/#weight/#band, #odN/#uwN windows, #syn,\
      \ term.field, #filreq/#filrej, #date:between) \u2014 returns ranked docs with per-constraint belief\
      \ diagnostics; graded matching: a query NEVER returns zero docs. Each hit includes a one-line best-matching\
      \ excerpt."
    manual: skills/indri_doc.md
    parameters:
      type: object
      properties:
        query:
          type: string
          description: 'An Indri query, e.g. #combine(dog train), #od1(white house), term.title, #date:between(2002-01-01
            2002-12-31).'
        k:
          type: integer
          description: Max ranked candidates to return (default 5).
      required:
      - query
  read:
    description: 'Read a file by line range. Code: a repo file path, up to ~80 lines per call. Docs (DCI
      baseline): a path relative to the corpus directory, offset (1-indexed line, default 1) and limit
      (default 2000 lines) page through long files.'
    parameters:
      type: object
      properties:
        path:
          type: string
          description: 'File path (code: repo-relative; docs: relative to the corpus directory).'
        start:
          type: integer
          description: 'Code arm: first line to read.'
        end:
          type: integer
          description: 'Code arm: last line to read.'
        offset:
          type: integer
          description: 'Doc DCI arm: 1-indexed line number to start reading from (default 1).'
        limit:
          type: integer
          description: 'Doc DCI arm: maximum number of lines to read (default 2000).'
      required:
      - path
  search_bqldf:
    description: "Boolean/structural search over the corpus (field-tagged term[field] syntax); returns\
      \ ranked candidates plus their STRUCTURE \u2014 code: a file's function/method names; docs: an article's\
      \ section names + infobox keys \u2014 no bodies, numbered for fetch."
    manual:
      general: skills/bql_doc.md
      wiki: skills/bql_doc.md
      browsecomp: skills/bql_browsecomp.md
    parameters:
      type: object
      properties:
        query:
          type: string
          description: 'Field-tagged Boolean query: term[field], AND/OR/NOT, wildcard*, "phrase". Code
            fields: def, call, string, comment, sig, file. Doc fields: title, body, section, infobox.'
        k:
          type: integer
          description: Max ranked candidates to return (default 5).
      required:
      - query
  search_bqldos:
    description: "Boolean/structural search over the corpus (field-tagged term[field] syntax); returns\
      \ ranked candidates plus their STRUCTURE \u2014 code: a file's function/method names; docs: an article's\
      \ section names + infobox keys \u2014 no bodies, numbered for fetch. Each hit includes a one-line\
      \ best-matching excerpt."
    manual:
      general: skills/bql_doc.md
      wiki: skills/bql_doc.md
      browsecomp: skills/bql_browsecomp.md
    parameters:
      type: object
      properties:
        query:
          type: string
          description: 'Field-tagged Boolean query: term[field], AND/OR/NOT, wildcard*, "phrase". Code
            fields: def, call, string, comment, sig, file. Doc fields: title, body, section, infobox.'
        k:
          type: integer
          description: Max ranked candidates to return (default 5).
      required:
      - query
  search_bqlds:
    description: "Boolean/structural search over the corpus (field-tagged term[field] syntax); returns\
      \ ranked candidates plus their STRUCTURE \u2014 code: a file's function/method names; docs: an article's\
      \ section names + infobox keys \u2014 no bodies, numbered for fetch. Each hit includes a one-line\
      \ best-matching excerpt."
    manual:
      general: skills/bql_doc.md
      wiki: skills/bql_doc.md
      browsecomp: skills/bql_browsecomp.md
    parameters:
      type: object
      properties:
        query:
          type: string
          description: 'Field-tagged Boolean query: term[field], AND/OR/NOT, wildcard*, "phrase". Code
            fields: def, call, string, comment, sig, file. Doc fields: title, body, section, infobox.'
        k:
          type: integer
          description: Max ranked candidates to return (default 5).
      required:
      - query
  search_s:
    description: "Boolean/structural search over the corpus (field-tagged term[field] syntax); returns\
      \ ranked candidates plus their STRUCTURE \u2014 code: a file's function/method names; docs: an article's\
      \ section names + infobox keys \u2014 no bodies, numbered for fetch. Each hit includes a one-line\
      \ best-matching excerpt."
    manual:
      general: skills/bql_doc.md
      wiki: skills/bql_doc.md
      browsecomp: skills/bql_browsecomp.md
    parameters:
      type: object
      properties:
        query:
          type: string
          description: 'Field-tagged Boolean query: term[field], AND/OR/NOT, wildcard*, "phrase". Code
            fields: def, call, string, comment, sig, file. Doc fields: title, body, section, infobox.'
        k:
          type: integer
          description: Max ranked candidates to return (default 5).
      required:
      - query
  visit:
    description: Read a whole document that a previous search ranked (the retrieve-then-visit baseline).
      Returns the full doc text, capped.
    parameters:
      type: object
      properties:
        rank:
          type: integer
          description: The 1-based rank from the last search, or a doc id.
      required:
      - rank
  visit_d:
    description: Read a whole document that a previous search ranked (the retrieve-then-visit baseline).
      Returns the full doc text, capped.
    parameters:
      type: object
      properties:
        rank:
          type: integer
          description: The 1-based rank from the last search, or a doc id.
      required:
      - rank
  visit_h:
    description: Read a whole document that a previous search ranked (the retrieve-then-visit baseline).
      Returns the full doc text, capped.
    parameters:
      type: object
      properties:
        rank:
          type: integer
          description: The 1-based rank from the last search, or a doc id.
      required:
      - rank
