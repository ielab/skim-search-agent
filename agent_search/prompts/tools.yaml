      properties:
        pattern:
          type: string
        dir:
          type: string
      required: [pattern]
  semantic_search:
    description: "Dense semantic search over code units; use when exact vocabulary is uncertain."
    parameters:
      type: object
      properties:
        query:
          type: string
      required: [query]
  open:
    description: "Open a file and show a line-numbered window. Optionally jump to a line."
