      browsecomp: skills/bql_browsecomp_v2.md
    parameters:
      type: object
      properties:
        query:
          type: string
          description: "Field-tagged Boolean query: term[field], AND/OR/NOT, wildcard*, \"phrase\", date[RANGE] (e.g. date[1980..1989], date[<2023-12])."
        k:
          type: integer
          description: "Max ranked candidates to return (default 5)."
      required: [query]
  visit_bqldo:
    # research_bql_donly_visit's read tool — SAME description/contract as `visit_bqld`/`visit_bv`
    # (the whole-doc read), just paired with `search_bqldo`'s dense-only ranking instead.
