      type: object
      properties: {}
  scroll_up:
    description: "Scroll the open file window up."
    parameters:
      type: object
      properties: {}
  submit:
    description: "Declare the functions/methods that must be edited, then stop. Each location should be path:function, most likely first."
    parameters:
      type: object
      properties:
        locations:
          type: array
          items:
            type: string
