    description: "Boolean/structural search over the corpus (field-tagged term[field] syntax); returns ranked candidates plus their STRUCTURE — code: a file's function/method names; docs: an article's section names + infobox keys — no bodies, numbered for fetch. Each hit includes a one-line best-matching excerpt."
