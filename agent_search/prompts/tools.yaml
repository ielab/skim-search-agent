    # dense_search_f make over their own bare/whole-doc siblings) — see doc_research.py's
    # `HybridFetchSnipWorkspace`. UNCOACHED (no manual).
    description: "Hybrid keyword+semantic search over the document corpus (Reciprocal Rank Fusion, RRF k=60, over a top-100 canonical BM25 pool and a top-100 dense-embedding pool). Returns ranked docs plus their section names + infobox keys + a best-matching excerpt for your query — NOT full text; fetch a named section to read. `fetch` a named section (or the infobox) of a ranked doc — no other documents are reachable."
    parameters:
      type: object
      properties:
        query:
          type: string
          description: "A keyword or natural-language query, for example: treaty that ended the Mexican-American War."
        k:
          type: integer
          description: "Max fused candidates to return (default 10)."
      required: [query]
  grep:
    # the code arm's grep baseline: a REAL regular expression over live source, returning
    # matching LINES (not units/files) — grep as intended (RISE gives agents rg/grep in a
    # shell). NO manual: models already know regex.
    description: "Regex search over all source (case-insensitive); returns matching lines as path:line: text. Invalid regex falls back to a literal substring search."
    parameters:
      type: object
      properties:
        pattern:
          type: string
          description: "A regular expression, for example sqlmigrate|rollback."
      required: [pattern]
  read:
    # shared by the code grep baseline (a file line-range) and the doc DCI baseline (a
    # corpus-file line-range); NO manual — a plain ranged read needs no teaching.
    description: "Read a file by line range. Code: a repo file path, up to ~80 lines per call. Docs (DCI baseline): a path relative to the corpus directory, offset (1-indexed line, default 1) and limit (default 2000 lines) page through long files."
    parameters:
      type: object
      properties:
        path:
          type: string
          description: "File path (code: repo-relative; docs: relative to the corpus directory)."
        start:
          type: integer
          description: "Code arm: first line to read."
        end:
          type: integer
          description: "Code arm: last line to read."
        offset:
          type: integer
          description: "Doc DCI arm: 1-indexed line number to start reading from (default 1)."
        limit:
          type: integer
          description: "Doc DCI arm: maximum number of lines to read (default 2000)."
      required: [path]
  bash:
    # shared by two arms: the doc arm's DCI baseline (no retriever at all — the corpus
    # directory holds every document) and the bm25_dci baseline (the corpus directory holds
    # ONLY the bm25_search top-k — everything else is out of reach). NO manual — a shell
    # needs no teaching.
    description: "Run a bash command (grep/rg/ls/find/wc) in the corpus directory to search for candidate files. The corpus directory contains only the documents available to you this episode (with bm25_search: only its top-ranked hits) — there is no broader search/retrieval tool. Output is truncated to the last ~2000 lines or ~50KB, whichever is hit first."
    parameters:
      type: object
      properties:
        command:
          type: string
          description: "A bash command, e.g. rg -l 'term' . or grep -rn 'term' ."
        timeout:
          type: number
          description: "Timeout in seconds (optional, default 60)."
      required: [command]
  bm25:
    description: "Lexical BM25 keyword search over the corpus; returns the top matching units/documents."
    parameters:
      type: object
      properties:
        query:
          type: string
          description: "A keyword query, for example retry backoff timeout."
      required: [query]
  dense:
    description: "Dense embedding (semantic) search over the corpus; use when the exact wording is uncertain."
    parameters:
      type: object
      properties:
        query:
          type: string
          description: "A natural-language query describing what you are looking for."
      required: [query]
  search_dir:
    description: "Grep for a literal term across all files; returns each matching file with a match count."
