    description: "Hybrid keyword+semantic search over the document corpus (Reciprocal Rank Fusion, RRF k=60, over a top-100 canonical BM25 pool and a top-100 dense-embedding pool); returns the FULL TEXT of the top-ranked documents directly (not a listing to visit) — there is no separate visit or fetch tool in this condition, so everything you need from a hit is already in this response."
